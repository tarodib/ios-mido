name: mesa-ios
on:
  push:
    branches: [mido]
    paths: ['mido/gl/**', '.github/workflows/mesa-ios.yml']
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner
        default: macos-15-intel
jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Deps
        run: |
          brew install ninja bison flex
          python3 -m venv venv
          venv/bin/pip install -q meson mako pyyaml packaging
          echo "$PWD/venv/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: mesa-work
          key: mesa-work-${{ hashFiles('mido/gl/mesa.patch') }}-v1
      - name: Build Mesa for iOS
        run: bash mido/gl/build-mesa-ios.sh "$PWD/mesa-ios-libs.tgz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mesa-ios
          path: |
            mesa-ios-libs.tgz
            midogl-test
            mesa-work/mesa-build/meson-logs/meson-log.txt
          if-no-files-found: warn
